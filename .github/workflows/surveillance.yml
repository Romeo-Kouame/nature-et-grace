# Surveillance : toutes les 15 minutes, GitHub vérifie que l'API et sa base répondent.
# En cas de panne, ce contrôle échoue et GitHub prévient par e-mail (Paramètres GitHub > Notifications > Actions).
#
# À faire une fois le site en ligne : Settings > Secrets and variables > Actions > New repository secret
#   HEALTH_URL = https://<adresse de l'API>/api/health
#   SITE_URL   = https://<adresse du site>   (facultatif : vérifie aussi que la page d'accueil s'affiche)
# Tant que HEALTH_URL n'existe pas, le contrôle s'arrête sans erreur.
# Note : GitHub suspend les tâches planifiées d'un dépôt sans activité pendant 60 jours (un commit suffit à les relancer).
name: Surveillance

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Le site répond
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API et base de données
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::notice::HEALTH_URL n'est pas encore configuré : surveillance en attente de la mise en ligne."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 20 --retry-all-errors "$HEALTH_URL" | grep -q '"ok"'
      - name: Page d'accueil
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then exit 0; fi
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 20 --retry-all-errors -o /dev/null "$SITE_URL"
